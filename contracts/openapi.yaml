            "type": "array",
            "maxItems": 30,
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string"
                },
                "type": {
                  "enum": [
                    "device-property",
                    "history-chart",
                    "alert-list",
                    "recommendation"
