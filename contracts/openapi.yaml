    "/api/daily-advice/run": {
      "post": {
        "summary": "Generate or deliver today's Agent advice; check response status",
        "parameters": [
          {
            "name": "dryRun",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Execution result; FAILED is also reported in status",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "enum": [
                        "DRY_RUN",
                        "SENT",
                        "SKIPPED_ALREADY_SENT",
                        "SKIPPED_RUNNING",
                        "DELIVERY_NOT_CONFIGURED",
                        "FAILED"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    },
                    "result": {
                      "type": "object"
                    },
                    "context": {
                      "type": "object"
                    },
                    "reason": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/notifications/email": {
      "post": {
        "summary": "Fixed-recipient local email endpoint; disabled by default",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "subject",
                  "body"
                ],
                "properties": {
                  "subject": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 160,
                    "pattern": "^[^\\r\\n]+$"
                  },
                  "body": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 4000
                  },
                  "idempotencyKey": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_-]{1,51}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "SENT or SKIPPED_ALREADY_SENT"
          },
          "400": {
            "description": "Invalid input"
          },
          "404": {
            "description": "API disabled"
          },
          "503": {
            "description": "Email delivery not configured"
          },
          "500": {
            "description": "Email delivery failed; receipt rolled back"
          }
        }
      }
    }
