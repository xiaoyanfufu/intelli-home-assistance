                            "history-chart",
                            "alert-list",
                            "recommendation"
                          ]
                        },
                        "x": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 11
                        },
                        "y": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 1000
                        },
                        "width": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 12
                        },
                        "height": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 1000
                        },
                        "binding": {
                          "type": "object"
                        }
                      },
                      "required": [
                        "id",
                        "type",
                        "x",
                        "y",
                        "width",
                        "height",
                        "binding"
                      ],
                      "additionalProperties": false
                    }
                  }
